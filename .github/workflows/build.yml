name: Build survey

# Every push to main rebuilds the sheets and publishes them to GitHub
# Pages. Pull requests get the same build, but the results are only
# attached to the run as a downloadable artifact, and pictures of what
# changed on each sheet are posted on the PR by pr-comment.yml, not
# published. Every run, main included, attaches the artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # output/ is git-ignored, so it does not exist in a fresh checkout
      # and Therion will not create it -- it fails at the copy step with
      # "cannot copy: No such file or directory".
      - name: Create output directory
        run: mkdir -p output

      # The survey is tied to the OS grid (cs OSGB:ST in
      # Swildons_Centreline.th), and turning that into lat/long for the
      # KML exports needs Ordnance Survey's OSTN15 grid-shift file.
      # Therion would download it itself on every run; fetch it once,
      # cache it, and point PROJ at it so the build never needs the
      # network.
      - name: Cache the OSTN15 grid
        id: grid
        uses: actions/cache@v4
        with:
          path: proj/
          key: proj-uk_os_OSTN15_NTv2_OSGBtoETRS-v1

      - name: Fetch the OSTN15 grid
        if: steps.grid.outputs.cache-hit != 'true'
        run: |
          mkdir -p proj
          curl -fsSL --retry 3 -o proj/uk_os_OSTN15_NTv2_OSGBtoETRS.tif \
            https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif

      # The container carries Therion, a TeX distribution, METAPOST,
      # Ghostscript and python3 -- everything the build needs. It is
      # pinned to a version rather than :latest so a survey rebuilt in a
      # year renders identically; bump it deliberately.
      # --user maps the container's root output back to the runner user
      # so later steps can read and upload it.
      #
      # Four configs, because Therion takes one map per projection per
      # run: swildons.thconfig is the whole cave, swildons-entrance.thconfig the Entrance
      # Series at 1:200, swildons-centreline.thconfig and swildons-stanton.thconfig the
      # working sheets with survey legs. The others get their own logs so output/therion.log
      # stays the main build's, which web/make_index.py reads.
      - name: Build with Therion
        run: |
          therion() {
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -u "$(id -u):$(id -g)" \
              -e PROJ_DATA=/project/proj:/usr/share/proj \
              -e PROJ_NETWORK=OFF \
              ghcr.io/paperclipmonkey/therion:6.4.0 "$@"
          }
          therion -l output/therion.log swildons.thconfig
          therion -l output/therion-entrance.log swildons-entrance.thconfig
          therion -l output/therion-centreline.log swildons-centreline.thconfig
          therion -l output/therion-stanton.log swildons-stanton.thconfig
          # the background for the route cards, built in the next step
          therion -l output/therion-routes.log tools/routes/routes.thconfig

      - name: Fail if Therion logged an error
        run: |
          status=0
          for log in output/therion.log output/therion-entrance.log output/therion-centreline.log output/therion-stanton.log output/therion-routes.log; do
            if grep -qE "^therion: error" "$log"; then
              echo "::error::Therion reported an error in $log"
              grep -nE "^therion: (error|warning)" "$log"
              status=1
            fi
          done
          # Warnings are worth surfacing but not worth failing on. The
          # drawings currently give a handful of "scrap outline
          # intersects itself" warnings from MetaPost.
          if grep -qiE "warning" output/therion.log output/therion-entrance.log output/therion-centreline.log output/therion-stanton.log; then
            echo "::group::Therion warnings"
            grep -inE "warning" output/therion.log output/therion-entrance.log output/therion-centreline.log output/therion-stanton.log | sort -u
            echo "::endgroup::"
          fi
          exit $status

      # Route cards (tools/routes): one A3 sheet per route in routes/*.toml,
      # drawn over the plan just rendered and printed to PDF by Chrome,
      # which the runner has. Plain Python, no packages needed.
      - name: Build the route cards, surface map, 3D view and 2D map
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          python3 -m tools.routes
          # the surface map: parking and walks from surface/surface.geojson
          # over OpenStreetMap (tiles cached in surface/tiles/)
          python3 -m tools.surface
          # the 3D view: the cave under the LIDAR ground (cached in
          # surface/lidar/), with a still for the index page
          python3 -m tools.model3d
          # the GeoJSON downloads and the 2D map over the ground, from
          # Therion's shapefiles and the LIDAR tools.model3d just saved.
          # shapely clips the area fills to the walls, as Therion does.
          python3 -m venv "$RUNNER_TEMP/webmap"
          "$RUNNER_TEMP/webmap/bin/pip" install -q shapely
          "$RUNNER_TEMP/webmap/bin/python" -m tools.webmap
          # the shapefiles are in OS grid metres within square ST, not
          # something to publish; the GeoJSON is their published form
          rm -rf output/esri-plan output/esri-model

      - name: Build the index page
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -u "$(id -u):$(id -g)" \
            -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY \
            --entrypoint python3 \
            ghcr.io/paperclipmonkey/therion:6.4.0 web/make_index.py
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Summarise the build
        run: |
          {
            echo "### Survey built"
            echo
            cat output/stats.md
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            for f in output/*.pdf output/*.svg output/*.3d output/*.lox output/*.kml output/*.geojson; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every run attaches the built sheets to the run page, so they can
      # be downloaded whether or not Pages is set up. On a PR this is
      # the only place they go.
      - name: Upload build
        id: pr_artifact
        uses: actions/upload-artifact@v4
        with:
          name: survey-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: output/
          retention-days: 14

      # ---- pull requests: diff the sheets, don't publish -------------
      #
      # Every sheet is compared with the published survey, which is main
      # as it stands: the PR build is of the PR merged into main, so the
      # differences are the PR's own. This job runs the PR's code, so it
      # has no write access (none at all for a PR from a fork); it uploads
      # the pictures and pr-comment.yml, which runs from main with write
      # access, puts them on the PR.
      - name: Diff the sheets against the published survey
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          command -v pdftoppm || { sudo apt-get update -q && sudo apt-get install -yq poppler-utils; }
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy pillow
          mkdir -p pr-diff
          jq -n --argjson number "$PR_NUMBER" --arg head_sha "$PR_HEAD_SHA" \
            '{number: $number, head_sha: $head_sha}' > pr-diff/pr.json
          cp output/stats.md pr-diff/ || true
          # A failed comparison shouldn't fail the build: the comment
          # says so instead.
          site="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" &&
            "$RUNNER_TEMP/venv/bin/python" -m tools.pdfdiff --base "$site" --head output --out pr-diff ||
            { echo "::warning::Couldn't compare the sheets with the published survey"; rm -f pr-diff/manifest.json; }

      - name: Upload the diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-diff
          path: pr-diff/
          retention-days: 14

      # ---- main: publish to Pages ------------------------------------
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
