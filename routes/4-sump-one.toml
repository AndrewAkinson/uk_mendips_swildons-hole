# Also make a card for the same route backwards
way_out = true
way_out_title = "The way out from Sump 1"
way_out_subtitle = "Back up the streamway from Sump 1 to the bottom of the Old 40"
way_out_description = """
From Sump 1 back up the streamway: through Tratman's Temple, past Barnes Loop, up Double Pots and the 20ft Pot to the bottom of the Old 40.
"""

