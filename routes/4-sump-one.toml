title = "The streamway to Sump 1"
subtitle = "From the Old 40 down the streamway, past the 20ft Pot and Double Pots, to Sump 1"
description = """
Follow the stream down from the bottom of the Old 40: Folded Strata, the
20ft Pot, Double Pots, past the entrance to Barnes Loop and through
Tratman's Temple to Sump 1. The route ends at the dive-line bolt; going
further means diving the sump.
"""
